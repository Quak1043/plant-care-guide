<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<!-- 主题在首次绘制前应用：v7 把这段逻辑放在 body 末尾的 main.js 里，深色模式用户每次都会先闪一帧白底 -->
<script>!function(){try{var t=localStorage.getItem("theme");if(t?t==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.setAttribute("data-theme","dark")}catch(e){}}();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="{{THEME_COLOR}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="index, follow, max-image-preview:large">

<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="{{OG_IMAGE_W}}">
<meta property="og:image:height" content="{{OG_IMAGE_H}}">
<meta name="twitter:card" content="{{TWITTER_CARD}}">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<!-- 标题字体自托管子集（约 200KB，只含站点用到的汉字）；正文走系统字体栈，零下载。
     v7 用 @import 拉 Google Fonts：串行阻塞，且 fonts.googleapis.com 在大陆不可达。 -->
<link rel="preload" href="fonts/noto-serif-sc-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
{{PRELOAD}}
{{JSONLD}}

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ADSENSE}}" crossorigin="anonymous"></script>
<!-- Google CMP (Funding Choices) -->
<script async src="https://fundingchoicesmessages.google.com/i/{{ADSENSE}}?ers=1"></script>
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{GA4}}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date);gtag("config","{{GA4}}");</script>
{{HEAD_EXTRA}}
</head>
<body>
